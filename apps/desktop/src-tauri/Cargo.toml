[package]
name = "desktop"
version = "0.0.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
teamspace-core = { path = "../../../crates/teamspace-core" }

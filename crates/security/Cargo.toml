[package]
name = "security"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
application = { path = "../application" }
teamspace-domain = { path = "../domain" }
tokio = { version = "1", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "persistence-sqlite"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
application = { path = "../application" }
teamspace-domain = { path = "../domain" }
sha2 = "=0.10.9"
serde_json = "1.0.149"
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "migrate"] }
sqlx-sqlite = { version = "=0.8.6", default-features = false, features = ["bundled", "migrate"] }

[dev-dependencies]
security = { path = "../security" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The lease-guard tests derive their expected statuses from the domain type
# instead of hard-coding eight string literals. Without this edge the domain's
# `LEASE_BEARING_STATUSES` and the SQL in `0012` are two independent lists with
# nothing tying them: the tenth review changed `RunStatus::Queued` to a second
# `RunStatus::Unknown` and the whole domain suite stayed green while the
# database kept enforcing the old set. Workspace-internal, dev-only, and
# `teamspace-domain` does not depend on this crate, so there is no cycle.
teamspace-domain = { path = "../domain" }

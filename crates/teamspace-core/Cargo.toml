[package]
name = "teamspace-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ts-rs = "12"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "teamspace-e2e-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Test-only HTTP bridge that exposes the Teamspace core to the end-to-end browser tests."

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teamspace-core = { path = "../teamspace-core" }
